<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Les moyens de transport</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0ff;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .emoji {
            font-size: 70px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="emoji">🚀</div>

        <h1>Les moyens de transport</h1>

        <p>
            Bienvenue dans notre projet STEM !
        </p>

        <div class="card">

            <h2>La fusée</h2>

            <p>
                Une fusée est un véhicule conçu pour voyager
                dans l'espace.
            </p>

            <p>
                Découvrez les différents moyens de transport
                à travers notre projet interactif.
            </p>

        </div>

    </div>

</body>
</html>
